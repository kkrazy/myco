{{- if .Values.envFile }}
{{- $ns := .Release.Namespace }}
{{- $rel := .Release.Name }}
# 运行时环境 Secret —— 内容来自 --set-file envFile=<state/.env 路径>。
# 源机 Docker state 的 .env 原样导入（ANTHROPIC_*、代理配置、NO_PROXY 等）。
# 仅取 KEY=VALUE 行；# 注释和空行跳过。值含特殊字符（如代理 URL 的 @ :），
# key/value 分别 quote，值里再出现 " 也不会破坏 YAML。
# 注意：.env 里建议把集群网段追加进 NO_PROXY/no_proxy：
#   7.242.106.252,7.242.106.110,7.242.109.33,10.244.0.0/16,10.96.0.0/12,.svc,.cluster.local
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rel }}-env
  namespace: {{ $ns }}
type: Opaque
stringData:
{{- range $line := splitList "\n" .Values.envFile }}
{{- $l := $line | trimAll " \r\t" }}
{{- if and $l (not ($l | hasPrefix "#")) (contains "=" $l) }}
  {{ $kv := regexSplit "=" $l 2 }}{{ index $kv 0 | trimAll " \r\t" | quote }}: {{ index $kv 1 | quote }}
{{- end }}
{{- end }}
{{- end }}
